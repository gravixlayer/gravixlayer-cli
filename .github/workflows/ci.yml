name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Large async tests generate futures that can exceed libtest's 8MiB
      # test-thread stack in debug builds on x86_64.
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@v4
      # Linux runners ship with ~10GB of unused preinstalled toolchains;
      # the registry + test-binary target dir can overflow the free disk
      # (ENOSPC mid-link → linker SIGBUS, cache-save fails).
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      # GNU ld intermittently dies with SIGBUS on the Ubuntu image; lld
      # links faster. Linux-only — Apple/MSVC targets reject the flag.
      - name: Use lld on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lld
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # cache-on-failure: keep the dependency cache fresh even when a step
      # fails so a red job does not strand the next run on a stale snapshot.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --all-targets --locked

  # Linux musl static binaries (used by the curl|sh installer).
  linux-musl:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      # cross pulls multi-GB build containers; reclaim the preinstalled
      # toolchains first so the image pull + target dir fit the disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

  # Native macOS builds (do not cross-compile Darwin from Linux).
  macos:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

  windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
