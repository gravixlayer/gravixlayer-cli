# Tag-driven release pipeline.
#
# Trigger: push a version tag (vX.Y.Z / vX.Y.Z-alpha.N / vX.Y.Z-beta.N)
# Prefer: ./scripts/release.sh X.Y.Z  (bumps Cargo.toml + Cargo.lock, commits, tags)
#
# Produces GitHub Release assets for scripts/install.sh / install.ps1:
#   gravixlayer-<tag>-<rust-triple>.tar.gz   (Unix)
#   gravixlayer-<tag>-<rust-triple>.zip      (Windows)
#   + .sha256 side-cars, SHA256SUMS, install.sh, install.ps1

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag-check:
    name: Tag matches Cargo.toml + lockfile
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag vs Cargo.toml and Cargo.lock
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_NAME="$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)"
          CARGO_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)"
          LOCK_VERSION="$(awk -v name="$PKG_NAME" '
            $0 == "name = \"" name "\"" { want=1; next }
            want && /^version = "/ {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' Cargo.lock)"

          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag '$VERSION' != Cargo.toml '$CARGO_VERSION'. Run ./scripts/release.sh $VERSION"
            exit 1
          fi
          if [ "$VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::Tag '$VERSION' != Cargo.lock package '$LOCK_VERSION'. Run ./scripts/set-version.sh $VERSION and commit Cargo.lock"
            exit 1
          fi

          # Fail before matrix builds if --locked would need a lockfile rewrite.
          cargo metadata --format-version 1 --locked >/dev/null

          PRERELEASE=false
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Validated tag=$TAG cargo=$CARGO_VERSION lock=$LOCK_VERSION prerelease=$PRERELEASE"

  build:
    name: Build (${{ matrix.target }})
    needs: tag-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive + checksum
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_SRC="target/${TARGET}/release/gravixlayer"
          test -f "$BIN_SRC"
          STAGE="$(mktemp -d)"
          cp "$BIN_SRC" "${STAGE}/gravixlayer"
          chmod +x "${STAGE}/gravixlayer"
          ARCHIVE="gravixlayer-${TAG}-${TARGET}.tar.gz"
          tar -C "$STAGE" -czf "dist/${ARCHIVE}" gravixlayer
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
          else
            (cd dist && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")
          fi
          rm -rf "$STAGE"
          ls -la dist/

      - name: Package Windows archive + checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binSrc = Join-Path "target/$env:TARGET/release" "gravixlayer.exe"
          if (-not (Test-Path $binSrc)) { throw "Missing binary: $binSrc" }

          $stage = Join-Path $env:RUNNER_TEMP "glpack-$env:TARGET"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $binSrc (Join-Path $stage "gravixlayer.exe") -Force

          $archive = "gravixlayer-$($env:TAG)-$($env:TARGET).zip"
          $distFull = (Resolve-Path dist).Path
          $archivePath = Join-Path $distFull $archive
          Compress-Archive -Path (Join-Path $stage "gravixlayer.exe") -DestinationPath $archivePath -Force

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$archivePath.sha256" -Value "$hash  $archive" -NoNewline
          Get-ChildItem dist
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [tag-check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Assemble dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} dist/ \;
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          (
            cd dist
            : > SHA256SUMS
            for f in *.tar.gz *.zip; do
              [ -f "$f" ] || continue
              if [ -f "${f}.sha256" ]; then
                cat "${f}.sha256" >> SHA256SUMS
                printf '\n' >> SHA256SUMS
              else
                sha256sum "$f" >> SHA256SUMS
              fi
            done
          )
          ls -la dist/
          # Every matrix target must have produced an archive.
          test "$(find dist -name 'gravixlayer-*.tar.gz' -o -name 'gravixlayer-*.zip' | wc -l | tr -d ' ')" -eq 6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-check.outputs.tag }}
          name: ${{ needs.tag-check.outputs.version }}
          prerelease: ${{ needs.tag-check.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
